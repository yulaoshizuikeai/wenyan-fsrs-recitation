name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_assets
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$VERSION_TAG" ]; then
              VERSION_TAG="v1.0.0"
            fi
          fi
          
          # Copy release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_assets/wenyan-recitation-${VERSION_TAG}.apk"
          fi
          
          # Copy debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release_assets/wenyan-recitation-${VERSION_TAG}-debug.apk"
          fi
          
          # Generate SHA256 checksums
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "tag_name=${VERSION_TAG}" >> $GITHUB_OUTPUT

      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wenyan-apks-${{ steps.prepare_artifacts.outputs.tag_name }}
          path: release_assets/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: "文言背诵 ${{ steps.prepare_artifacts.outputs.tag_name }}"
          files: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
