name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_assets
          DATE_STR=$(date +'%Y%m%d-%H%M')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          # Extract version from build.gradle.kts
          GRADLE_VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')

          # Determine version tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${{ github.ref_name }}"
            IS_RELEASE_TAG=true
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
            IS_RELEASE_TAG=true
          else
            VERSION_TAG="v${GRADLE_VERSION}-${COMMIT_HASH}"
            IS_RELEASE_TAG=false
          fi
          
          # Copy release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_assets/wenyan-recitation-${VERSION_TAG}.apk"
          fi
          
          # Generate SHA256 checksums
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          
          echo "tag_name=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "is_release_tag=${IS_RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wenyan-apks-${{ steps.prepare_artifacts.outputs.tag_name }}
          path: release_assets/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: "文言背诵 ${{ steps.prepare_artifacts.outputs.tag_name }}"
          files: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
